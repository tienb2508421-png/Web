<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tính tiền trọ</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
}
.box {
  max-width: 520px;
  margin: 30px auto;
  background: #fff;
  padding: 20px;
  border-radius: 10px;
}
h2 { text-align: center; }
label { display: block; margin-top: 10px; }
input, select, button {
  width: 100%;
  padding: 8px;
  margin-top: 4px;
}
button {
  margin-top: 12px;
  font-size: 16px;
}
.month {
  border-top: 1px solid #ddd;
  margin-top: 10px;
  padding-top: 10px;
  white-space: pre-line;
}
.edit {
  background: #ff9800;
  color: white;
}
.delete {
  background: #f44336;
  color: white;
}
</style>
</head>

<body>
<div class="box">
<h2>🏠 TÍNH TIỀN TRỌ</h2>

<label>Số người ở:</label>
<input type="number" id="people" value="1" min="1">

<label>Chỉ số điện MỚI:</label>
<input type="number" id="dienMoi">

<label>Chỉ số nước MỚI:</label>
<input type="number" id="nuocMoi">

<button onclick="themThang()">➕ Thêm tháng mới</button>

<hr>

<label>Chọn tháng cần sửa:</label>
<select id="chonThang"></select>

<label>Điện MỚI (sửa):</label>
<input type="number" id="dienSua">

<label>Nước MỚI (sửa):</label>
<input type="number" id="nuocSua">

<button class="edit" onclick="suaThang()">✏️ Sửa tháng</button>
<button class="delete" onclick="resetAll()">🗑️ Xóa toàn bộ</button>

<div id="list"></div>
</div>

<script>
const GIA_DIEN = 4000;
const GIA_NUOC = 12000;
const TIEN_PHONG = 2200000;
const TIEN_RAC = 5000;

let months = JSON.parse(localStorage.getItem("months")) || [];

function save() {
  localStorage.setItem("months", JSON.stringify(months));
}

function themThang() {
  let dienMoi = Number(dienMoiInput.value);
  let nuocMoi = Number(nuocMoiInput.value);
  let people = Number(peopleInput.value);

  let last = months[months.length - 1];
  let dienCu = last ? last.dienMoi : 0;
  let nuocCu = last ? last.nuocMoi : 0;

  if (dienMoi < dienCu || nuocMoi < nuocCu) {
    alert("Chỉ số mới phải >= chỉ số cũ");
    return;
  }

  months.push({
    thang: months.length + 1,
    dienCu, dienMoi,
    nuocCu, nuocMoi
  });

  save();
  render();
}

function suaThang() {
  let idx = chonThang.value;
  if (idx === "") return;

  months[idx].dienMoi = Number(dienSua.value);
  months[idx].nuocMoi = Number(nuocSua.value);

  for (let i = idx; i < months.length; i++) {
    if (i > 0) {
      months[i].dienCu = months[i - 1].dienMoi;
      months[i].nuocCu = months[i - 1].nuocMoi;
    }
    if (months[i].dienMoi < months[i].dienCu ||
        months[i].nuocMoi < months[i].nuocCu) {
      alert("Sai dữ liệu sau khi sửa!");
      return;
    }
  }

  save();
  render();
}

function render() {
  list.innerHTML = "";
  chonThang.innerHTML = "<option value=''>-- Chọn tháng --</option>";

  months.forEach((m, i) => {
    let sd = m.dienMoi - m.dienCu;
    let sn = m.nuocMoi - m.nuocCu;
    let tong = TIEN_PHONG + TIEN_RAC + sd * GIA_DIEN + sn * GIA_NUOC;

    list.innerHTML += `
<div class="month">
📅 Tháng ${m.thang}
⚡ Điện: ${sd} kWh
💧 Nước: ${sn} m³
💰 Tổng: ${tong.toLocaleString()} VND
</div>`;

    chonThang.innerHTML += `<option value="${i}">Tháng ${m.thang}</option>`;
  });
}

function resetAll() {
  if (confirm("Xóa toàn bộ dữ liệu?")) {
    localStorage.clear();
    months = [];
    render();
  }
}

const dienMoiInput = document.getElementById("dienMoi");
const nuocMoiInput = document.getElementById("nuocMoi");
const dienSua = document.getElementById("dienSua");
const nuocSua = document.getElementById("nuocSua");
const peopleInput = document.getElementById("people");
const list = document.getElementById("list");
const chonThang = document.getElementById("chonThang");

render();
</script>
</body>
</html>
