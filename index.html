<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tính tiền trọ</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
}
.box {
    max-width: 420px;
    margin: 40px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}
h2 {
    text-align: center;
}
label {
    display: block;
    margin-top: 12px;
}
input {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
}
button {
    width: 100%;
    padding: 10px;
    margin-top: 15px;
    font-size: 16px;
}
.result {
    margin-top: 15px;
    white-space: pre-line;
}
.reset {
    background: #f44336;
    color: white;
}
</style>
</head>

<body>
<div class="box">
    <h2>🏠 TÍNH TIỀN TRỌ</h2>

    <label>Số người ở:</label>
    <input type="number" id="people" value="1" min="1">

    <label>Chỉ số điện MỚI:</label>
    <input type="number" id="dienMoi">

    <label>Chỉ số nước MỚI:</label>
    <input type="number" id="nuocMoi">

    <button onclick="tinhTien()">Tính tiền tháng này</button>
    <button class="reset" onclick="resetAll()">Reset về tháng 1</button>

    <div class="result" id="output"></div>
</div>

<script>
const GIA_DIEN = 4000;
const GIA_NUOC = 12000;
const TIEN_PHONG = 2200000;
const TIEN_RAC = 5000;

let dienCu = Number(localStorage.getItem("dienCu")) || 0;
let nuocCu = Number(localStorage.getItem("nuocCu")) || 0;
let thang = Number(localStorage.getItem("thang")) || 0;

function tinhTien() {
    let dienMoi = Number(document.getElementById("dienMoi").value);
    let nuocMoi = Number(document.getElementById("nuocMoi").value);
    let people = Number(document.getElementById("people").value);

    if (dienMoi < dienCu || nuocMoi < nuocCu) {
        alert("Chỉ số mới phải lớn hơn hoặc bằng chỉ số cũ!");
        return;
    }

    let sdien = dienMoi - dienCu;
    let snuoc = nuocMoi - nuocCu;

    let tienDien = sdien * GIA_DIEN;
    let tienNuoc = snuoc * GIA_NUOC;
    let tong = TIEN_PHONG + TIEN_RAC + tienDien + tienNuoc;

    thang++;

    document.getElementById("output").innerText =
        `📅 Tháng: ${thang}
⚡ Điện: ${sdien} kWh = ${tienDien.toLocaleString()} VND
💧 Nước: ${snuoc} m³ = ${tienNuoc.toLocaleString()} VND
🏠 Phòng: ${TIEN_PHONG.toLocaleString()} VND
🗑️ Rác/DV: ${TIEN_RAC.toLocaleString()} VND
-------------------------
💰 Tổng: ${tong.toLocaleString()} VND
👤 Mỗi người: ${(tong / people).toLocaleString()} VND`;

    localStorage.setItem("dienCu", dienMoi);
    localStorage.setItem("nuocCu", nuocMoi);
    localStorage.setItem("thang", thang);

    document.getElementById("dienMoi").value = "";
    document.getElementById("nuocMoi").value = "";
}

function resetAll() {
    if (confirm("Reset toàn bộ dữ liệu về tháng 1?")) {
        localStorage.clear();
        location.reload();
    }
}
</script>
</body>
</html>
